version: 0.2

env:
  variables:
    TF_WORKING_DIR: "CAV.AccountUsage/Infrastructure"
    TF_VERSION: "1.9.0"

phases:
  install:
    commands:
      - echo "Installing Terraform $TF_VERSION..."
      - curl -sLo terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o terraform.zip -d /usr/local/bin
      - terraform -version

  build:
    commands:
      - cd $TF_WORKING_DIR
      - echo "Re-initializing Terraform..."
      - terraform init -input=false

      - echo "Applying saved plan (Lambda code + infra)..."
      - terraform apply -input=false -auto-approve tfplan

  post_build:
    commands:
      - echo "Terraform apply complete. Lambda infra + code deployed."

artifacts:
  files:
    - CAV.AccountUsage/Infrastructure/**/*
  base-directory: $CODEBUILD_SRC_DIR
